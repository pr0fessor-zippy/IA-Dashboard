<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Links</title>
<style>
  :root{
    --mist: #dbe6e4;
    --pine-deep: #16221f;
    --panel: rgba(18, 28, 26, 0.55);
    --panel-border: rgba(219, 230, 228, 0.18);
    --accent: #7fb6a8;
    --accent-soft: #9fd0c2;
    --text: #eef4f2;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background:
      linear-gradient(180deg, rgba(10,16,15,0.55) 0%, rgba(10,16,15,0.35) 40%, rgba(8,13,12,0.75) 100%),
      url('https://images.unsplash.com/photo-1672944777008-bfccc150d775?fm=jpg&q=80&w=2400&auto=format&fit=crop') center center / cover no-repeat fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 36px 28px 32px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  }

  h1 {
    color: var(--text);
    text-align: center;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .subtitle {
    text-align: center;
    color: var(--mist);
    opacity: 0.75;
    font-size: 0.85rem;
    margin: 0 0 28px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .link-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--pine-deep);
    background: linear-gradient(180deg, var(--accent-soft), var(--accent));
    font-weight: 600;
    font-size: 1.02rem;
    letter-spacing: 0.03em;
    padding: 15px 18px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease, background 0.4s ease, color 0.4s ease;
  }

  .link-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(0,0,0,0.35);
    filter: brightness(1.05);
  }

  .link-btn:active {
    transform: translateY(0px) scale(0.99);
  }

  .link-btn.live {
    background: linear-gradient(180deg, #9b2222, #5e0f0f);
    color: #ffffff;
    border-color: rgba(255,190,190,0.35);
    box-shadow: 0 0 0 2px rgba(155,34,34,0.35), 0 8px 20px rgba(0,0,0,0.4);
  }

  .time {
    flex-shrink: 0;
    width: 165px;
    text-align: right;
    color: var(--mist);
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }

  .slot {
    display: block;
    font-size: 0.88rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .slot + .slot {
    margin-top: 5px;
  }

  .slot .days {
    display: inline-block;
    width: 38px;
    text-align: left;
    font-size: 0.68rem;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  footer {
    text-align: center;
    color: var(--mist);
    opacity: 0.55;
    font-size: 0.75rem;
    margin-top: 26px;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Class Links</h1>
    <p class="subtitle">Tap a room to join &middot; all times Central</p>

    <div class="links" id="links"></div>

    <footer>Foggy mountain photo via Unsplash</footer>
  </div>

<script>
(function () {
  // Minutes before the scheduled start/end that the red highlight switches on/off
  const LEAD_MINUTES = 8;

  // Day numbers: 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat
  const MWF = [1, 3, 5];
  const TTH = [2, 4];
  const MON_FRI = [1, 2, 3, 4, 5];

  // Edit classes here. Each class can have one or more time slots (e.g. different times on MWF vs TTh).
  const CLASSES = [
    { name: 'BIBLE',     url: 'https://my.imperial-academy.org/mod/bigbluebuttonbn/view.php?id=159482',
      slots: [ { days: MWF, start: '8:00',  end: '8:40' } ] },

    { name: 'FORUM',     url: 'https://my.imperial-academy.org/mod/bigbluebuttonbn/view.php?id=159564',
      slots: [ { days: TTH, start: '8:00',  end: '8:30' } ] },

    { name: 'MATH',      url: 'https://my.imperial-academy.org/mod/bigbluebuttonbn/view.php?id=156751',
      slots: [ { days: MWF, start: '8:45',  end: '9:35' },
               { days: TTH, start: '8:35',  end: '9:25' } ] },

    { name: 'ENGLISH',   url: 'https://my.imperial-academy.org/mod/bigbluebuttonbn/view.php?id=160528',
      slots: [ { days: MWF, start: '9:40',  end: '10:35' },
               { days: TTH, start: '9:30',  end: '10:20' } ] },

    { name: 'HISTORY',   url: 'https://my.imperial-academy.org/mod/bigbluebuttonbn/view.php?id=151502',
      slots: [ { days: MWF, start: '10:40', end: '11:25' },
               { days: TTH, start: '10:25', end: '11:15' } ] },

    { name: 'LOUNGE',    url: 'https://my.imperial-academy.org/mod/bigbluebuttonbn/view.php?id=85662',
      slots: [ { days: MWF, start: '11:25', end: '12:10' },
               { days: TTH, start: '11:15', end: '12:10' } ] },

    { name: 'ADOBE',     url: 'https://my.imperial-academy.org/mod/bigbluebuttonbn/view.php?id=154365',
      slots: [ { days: MWF, start: '12:10', end: '1:00' } ] },

    { name: 'CHEMISTRY', url: 'https://my.imperial-academy.org/mod/bigbluebuttonbn/view.php?id=153973',
      slots: [ { days: MON_FRI, start: '1:05', end: '2:00' } ] }
  ];

  // Converts "8:00" -> 480, "12:30" -> 750, "1:05" -> 785 (hours 1-6 are PM)
  function toMin(s) {
    let [h, m] = s.split(':').map(Number);
    if (h < 7) h += 12;
    return h * 60 + m;
  }

  function dayLabel(days) {
    const same = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
    if (same(days, MWF)) return 'MWF';
    if (same(days, TTH)) return 'TTh';
    if (same(days, MON_FRI)) return 'M–F';
    const names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    return days.map(d => names[d]).join(' ');
  }

  // Current day (0=Sun..6=Sat) and minutes since midnight in Central Time
  function nowCentral() {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Chicago',
      weekday: 'short',
      hour: 'numeric',
      minute: 'numeric',
      hourCycle: 'h23'
    }).formatToParts(new Date());
    const get = t => parts.find(p => p.type === t).value;
    const days = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    return {
      day: days[get('weekday')],
      min: Number(get('hour')) * 60 + Number(get('minute'))
    };
  }

  // Build the list of rows
  const container = document.getElementById('links');
  const buttons = CLASSES.map(c => {
    const row = document.createElement('div');
    row.className = 'row';

    const btn = document.createElement('a');
    btn.className = 'link-btn';
    btn.href = c.url;
    btn.target = '_blank';
    btn.rel = 'noopener';
    btn.textContent = c.name;

    const time = document.createElement('div');
    time.className = 'time';
    c.slots.forEach(s => {
      const line = document.createElement('span');
      line.className = 'slot';
      line.innerHTML = '<span class="days">' + dayLabel(s.days) + '</span>' + s.start + ' &ndash; ' + s.end;
      time.appendChild(line);
    });

    row.appendChild(btn);
    row.appendChild(time);
    container.appendChild(row);
    return btn;
  });

  function update() {
    const now = nowCentral();
    CLASSES.forEach((c, i) => {
      const live = c.slots.some(s => {
        const start = toMin(s.start) - LEAD_MINUTES;
        const end = toMin(s.end) - LEAD_MINUTES;
        return s.days.includes(now.day) && now.min >= start && now.min < end;
      });
      buttons[i].classList.toggle('live', live);
    });
  }

  update();
  setInterval(update, 15000);
})();
</script>

</body>
</html>
